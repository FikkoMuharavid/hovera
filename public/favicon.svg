<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="capsuleBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="6" />

  <!-- Dynamic Island Capsule in Center -->
  <rect x="96" y="206" width="320" height="100" rx="50" fill="#000000" stroke="url(#capsuleBorder)" stroke-width="4" />

  <!-- Camera cutout (left circle) -->
  <circle cx="156" cy="256" r="22" fill="#09090b" stroke="#27272a" stroke-width="2" />
  <circle cx="156" cy="256" r="13" fill="#0f172a" />
  <circle cx="153" cy="253" r="4.5" fill="#38bdf8" opacity="0.9" />

  <!-- Waveform activity bars in center -->
  <rect x="220" y="245" width="6" height="22" rx="3" fill="#ffffff" opacity="0.7" />
  <rect x="236" y="238" width="6" height="36" rx="3" fill="#ffffff" opacity="0.95" />
  <rect x="252" y="246" width="6" height="20" rx="3" fill="#ffffff" opacity="0.6" />
  <rect x="268" y="240" width="6" height="32" rx="3" fill="#ffffff" opacity="0.85" />
  <rect x="284" y="247" width="6" height="18" rx="3" fill="#ffffff" opacity="0.5" />

  <!-- Active Status dot (right) -->
  <circle cx="356" cy="256" r="20" fill="#10b981" opacity="0.2" />
  <circle cx="356" cy="256" r="12" fill="#10b981" />
</svg>